workspace = 3, monitor:desc:Samsung Electric Company Odyssey G95C, persistent:true, default:true
workspace = 4, monitor:desc:LG Electronics LG ULTRAGEAR, persistent:true
workspace = 5, monitor:desc:Samsung Electric Company Odyssey G95C, persistent:true
workspace = 6, monitor:desc:LG Electronics LG ULTRAGEAR, persistent:true
workspace = 7, monitor:desc:Samsung Electric Company Odyssey G95C, persistent:true
workspace = 8, monitor:desc:LG Electronics LG ULTRAGEAR, persistent:true
workspace = 9, monitor:desc:Samsung Electric Company Odyssey G95C, persistent:true
workspace = 10, monitor:desc:LG Electronics LG ULTRAGEAR, persistent:true
